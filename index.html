<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numeri italiani</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{color-scheme:light;--bg:#f5f6f2;--card:#fff;--tx:#14213d;--mut:#5d6679;--bd:#d9dccf;--ok:#1d7a4a;--okbg:#e2f3e8;--bad:#c4352b;--badbg:#fbe5e2;--ac:#14213d;--acx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10151f;--card:#1a2130;--tx:#eef1f7;--mut:#a3adc2;--bd:#2f394d;--ok:#5ad08f;--okbg:#17372a;--bad:#ff8479;--badbg:#401f1c;--ac:#eef1f7;--acx:#10151f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10151f;--card:#1a2130;--tx:#eef1f7;--mut:#a3adc2;--bd:#2f394d;--ok:#5ad08f;--okbg:#17372a;--bad:#ff8479;--badbg:#401f1c;--ac:#eef1f7;--acx:#10151f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.tri{display:flex;height:4px;margin-bottom:20px;border-radius:2px;overflow:hidden}
.tri i{flex:1}.tri i:nth-child(1){background:#1d7a4a}.tri i:nth-child(2){background:#d9dccf}.tri i:nth-child(3){background:#c4352b}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--mut)}
select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
#st{color:var(--mut);font-size:.875rem;margin-bottom:8px;min-height:1.4em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px 20px}
.big{font-size:clamp(3.5rem,18vw,5.5rem);font-weight:800;line-height:1;letter-spacing:-.02em;text-align:center;margin:8px 0}
.word{font-size:clamp(1.5rem,7vw,2.2rem);font-weight:600;text-align:center;overflow-wrap:anywhere;margin:12px 0}
.hint{text-align:center;color:var(--mut);margin-bottom:16px}
.opts{display:grid;gap:10px}
button{font:inherit;cursor:pointer}
.opt{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:14px;font-size:1.1rem;text-align:center;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--tx)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pri{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:10px 14px}
.center{display:flex;justify-content:center;margin:12px 0}
.line{display:flex;gap:10px}.line input{font-size:1.2rem}
#fb{margin-top:16px;padding:12px 14px;border-radius:10px;display:none}
#fb.ok{display:block;background:var(--okbg);color:var(--ok)}
#fb.bad{display:block;background:var(--badbg);color:var(--bad)}
#nx{margin-top:16px;width:100%}
.note{color:var(--mut);font-size:.8125rem;margin-top:16px}
</style>
</head>
<body>
<main>
<div class="tri" aria-hidden="true"><i></i><i></i><i></i></div>
<h1>Numeri italiani</h1>
<p class="sub">Practice Italian numbers four different ways.</p>
<div class="row">
<label>Exercise
<select id="mode">
<option value="d2w">Number → choose the Italian word</option>
<option value="w2d">Italian word → choose the number</option>
<option value="l2d">Listen → type the number</option>
<option value="d2t">Number → type it in Italian</option>
</select></label>
<label>Range
<select id="range">
<option value="0-20">0–20</option>
<option value="0-99">0–99</option>
<option value="0-999" selected>0–999</option>
<option value="100-999">100–999 only</option>
</select></label>
</div>
<div id="st" aria-live="polite"></div>
<section class="card">
<div id="q"></div>
<div id="ans"></div>
<div id="fb" role="status"></div>
<button id="nx" class="pri" hidden>Next</button>
</section>
<p class="note">Numbers you miss come back more often until you get them right. Accents don’t matter when you type (tré and tre both work). For listening, your device needs an Italian text-to-speech voice.</p>
</main>
<script>
const U=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'];
const T=['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
function w2(n){if(n<20)return U[n];const t=T[n/10|0],u=n%10;if(!u)return t;const b=(u==1||u==8)?t.slice(0,-1):t;return b+(u==3?'tré':U[u])}
function words(n,el=true){if(n<100)return w2(n);const h=n/100|0,r=n%100;let p=h==1?'cento':U[h]+'cento';if(!r)return p;if(el&&r>=80&&r<90)p=p.slice(0,-1);return p+w2(r)}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const R={'0-20':[0,20],'0-99':[0,99],'0-999':[0,999],'100-999':[100,999]};
const $=id=>document.getElementById(id);
const S={score:0,total:0,streak:0,n:0,done:false,missed:[]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function say(n){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words(n));u.lang='it-IT';u.rate=.85;const v=speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith('it'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function dist(n,lo,hi){const s=String(n).padStart(3,'0'),c=[n+1,n-1,n+10,n-10,n+100,n-100,+(s[0]+s[2]+s[1]),+(s[1]+s[0]+s[2])];let o=[...new Set(c)].filter(x=>x!==n&&x>=lo&&x<=hi);shuffle(o);o=o.slice(0,3);while(o.length<3&&hi-lo>=3){const x=lo+Math.floor(Math.random()*(hi-lo+1));if(x!==n&&!o.includes(x))o.push(x)}return o}
function stats(){$('st').textContent='Score '+S.score+'/'+S.total+'  •  Streak '+S.streak+'  •  To review '+S.missed.length}
function next(){
S.done=false;const m=$('mode').value,[lo,hi]=R[$('range').value];
const pool=S.missed.filter(x=>x>=lo&&x<=hi);
S.n=(pool.length&&Math.random()<.3)?pool[Math.random()*pool.length|0]:lo+Math.floor(Math.random()*(hi-lo+1));
$('fb').className='';$('fb').innerHTML='';$('nx').hidden=true;
const q=$('q'),a=$('ans');a.innerHTML='';
if(m=='d2w'){q.innerHTML='<div class="big">'+S.n+'</div><div class="hint">Which is the Italian word?</div>';choices(v=>words(v))}
else if(m=='w2d'){q.innerHTML='<div class="word">'+words(S.n)+'</div><div class="hint">Which number is this?</div>';choices(v=>String(v))}
else{
if(m=='l2d'){q.innerHTML='<div class="center"><button class="pri" id="pl">🔊 Play</button></div><div class="hint">Type the number you hear.</div>';$('pl').onclick=()=>say(S.n);say(S.n)}
else q.innerHTML='<div class="big">'+S.n+'</div><div class="hint">Write it in Italian.</div>';
a.innerHTML='<div class="line"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" '+(m=='l2d'?'inputmode="numeric"':'')+' aria-label="Your answer"><button class="pri" id="ck">Check</button></div>';
$('ck').onclick=check;$('inp').focus()}
stats()}
function choices(fmt){const [lo,hi]=R[$('range').value];const g=document.createElement('div');g.className='opts';
shuffle([S.n,...dist(S.n,lo,hi)]).forEach(v=>{const b=document.createElement('button');b.className='opt';b.textContent=fmt(v);b.dataset.v=v;b.onclick=()=>{if(S.done)return;S.done=true;const ok=v==S.n;b.classList.add(ok?'ok':'bad');g.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v==S.n)x.classList.add('ok')});finish(ok)};g.appendChild(b)});
$('ans').appendChild(g)}
function check(){if(S.done)return;const v=$('inp').value.trim();if(!v)return;S.done=true;const m=$('mode').value;
const ok=m=='l2d'?v.replace(/\D/g,'')===String(S.n):[words(S.n),words(S.n,false)].map(norm).includes(norm(v));
$('inp').disabled=true;$('ck').disabled=true;finish(ok)}
function finish(ok){S.total++;const i=S.missed.indexOf(S.n);
if(ok){S.score++;S.streak++;if(i>-1)S.missed.splice(i,1)}else{S.streak=0;if(i<0)S.missed.push(S.n)}
const f=$('fb');f.className=ok?'ok':'bad';f.innerHTML=(ok?'Corretto! ':'Not quite. ')+'<strong>'+S.n+' = '+words(S.n)+'</strong> <button class="ghost" id="rp" style="margin-left:8px">🔊</button>';
$('rp').onclick=()=>say(S.n);say(S.n);$('nx').hidden=false;$('nx').focus();stats()}
$('nx').onclick=next;
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(S.done){if(document.activeElement!==$('nx'))next()}else if(document.activeElement===$('inp'))check()});
['mode','range'].forEach(id=>$(id).onchange=()=>{S.score=S.total=S.streak=0;next()});
if('speechSynthesis' in window)speechSynthesis.getVoices();
next();
</script>
</body>
</html>
